<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0906">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchmen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<title>Watchmen on the Wall — Conquest</title>
<style>html,body{margin:0;padding:0;height:100%;background:#0d0906;overflow:hidden;touch-action:none}
/* iPhone fullscreen hotfix: with viewport-fit=cover a home-screen
   (standalone) launch can paint edge-to-edge. Keep Phaser's centred
   canvas inside the device safe area so no battle circle can sit under
   the notch or the home indicator. Every inset is zero on ordinary
   rectangular screens, including Android. */
#game{position:fixed;inset:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
#game canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh;max-width:calc(100vw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}</style>
</head><body><div id="game"></div>
<script src="vendor/phaser.min.js"></script>
<script src="js/sfx.js"></script>
<script src="js/music.js"></script>
<script src="js/gxhub.js"></script>
<script src="js/tokens.js"></script>
<script src="js/progress.js"></script>
<script src="js/levels.js"></script>
<script src="js/art.js"></script>
<script src="js/main.js"></script>
<script src="js/net.js"></script>
</body></html>
